<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quack Café</title><link rel="icon" type="image/png" sizes="64x64" href="cafe-icon.png"><meta name="author" content="Sparsha Srinath"><link rel="stylesheet" href="cafe.css"><link rel="stylesheet" href="page-frame.css?v=anchored-footer"><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script><link rel="stylesheet" href="live.css?v=viewer-footer"></head><body>
